name: Weekly Crawler Update

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 1" # Runs at 00:00 every Monday

jobs:
  update-database:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Run Crawler
        run: dart run tool/crawler.dart

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update the database by the crawler ($(date +'%d/%m/%Y'))"
          branch: crawler-update
          base: main
          title: "Automated Database Update"
          body: |
            This pull request contains the latest updates from the crawler.
            Automated run by GitHub Actions.
          labels: update, automated
          add-paths: |
            lib/src/language_codes.dart